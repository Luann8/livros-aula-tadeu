# Configurações da Aplicação de Gerenciamento de Livros
spring.application.name=gerenciamento-livros
server.port=8080

# Configuração de caracteres UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Desabilita o listener nativo APR do Tomcat para evitar warnings desnecessários de JNI em JDKs recentes
server.tomcat.apr.enabled=false

# Formatação dos logs
logging.level.com.biblioteca=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
